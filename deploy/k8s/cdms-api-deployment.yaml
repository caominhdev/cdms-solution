apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdms-api
  namespace: cdms
  labels:
    app: cdms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cdms-api
  template:
    metadata:
      labels:
        app: cdms-api
    spec:
      containers:
      - name: cdms-api
        image: cdms-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: cdms-config
        - secretRef:
            name: cdms-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /swagger/v1/swagger.json
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /swagger/v1/swagger.json
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cdms-api
  namespace: cdms
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: cdms-api
