apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
  namespace: cdms
  labels:
    app: cockroachdb
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: cockroachdb
---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
  namespace: cdms
  labels:
    app: cockroachdb
spec:
  clusterIP: None
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: cockroachdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: cdms
spec:
  serviceName: "cockroachdb"
  replicas: 3
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v23.2.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
        command:
          - "/bin/bash"
          - "-ecx"
          - >
            exec /cockroach/cockroach start --insecure
            --advertise-host $(hostname -f)
            --http-addr 0.0.0.0:8080
            --listen-addr 0.0.0.0:26257
            --join cockroachdb-0.cockroachdb.cdms.svc.cluster.local,cockroachdb-1.cockroachdb.cdms.svc.cluster.local,cockroachdb-2.cockroachdb.cdms.svc.cluster.local
            --cache 25%
            --max-sql-memory 25%
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
