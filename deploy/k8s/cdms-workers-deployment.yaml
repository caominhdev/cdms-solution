apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdms-workers
  namespace: cdms
  labels:
    app: cdms-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cdms-workers
  template:
    metadata:
      labels:
        app: cdms-workers
    spec:
      containers:
      - name: cdms-workers
        image: cdms-workers:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: cdms-config
        - secretRef:
            name: cdms-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "1.5"
            memory: "1Gi"
